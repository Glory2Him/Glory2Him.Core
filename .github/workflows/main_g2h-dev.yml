# Docs for the Azure Web Apps Deploy action: https://github.com/Azure/webapps-deploy
# More GitHub Actions for Azure: https://github.com/Azure/actions

name: Build and deploy ASP.Net Core app to Azure Web App - g2h-dev

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read #This is required for actions/checkout

    steps:
      - uses: actions/checkout@v4

      - name: Set up .NET Core
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.x'

      # The publish target builds the React SPA (npm install + npm run build in
      # Glory2Him.WebApp.React), so pin Node rather than relying on the runner image.
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Build with dotnet
        run: dotnet build Websites/Glory2Him.WebApp/Glory2Him.WebApp.csproj --configuration Release

      # Publish ONLY the web host. Publishing the whole solution dumps every project
      # (tests, NuGet libraries) into one folder and fails with NETSDK1152 collisions.
      - name: dotnet publish
        run: dotnet publish Websites/Glory2Him.WebApp/Glory2Him.WebApp.csproj -c Release -o ${{env.DOTNET_ROOT}}/myapp

      - name: Upload artifact for deployment job
        uses: actions/upload-artifact@v4
        with:
          name: .net-app
          path: ${{env.DOTNET_ROOT}}/myapp

  deploy:
    runs-on: ubuntu-latest
    needs: build
    permissions:
      id-token: write #This is required for requesting the JWT
      contents: read #This is required for actions/checkout

    steps:
      - name: Download artifact from build job
        uses: actions/download-artifact@v4
        with:
          name: .net-app
      
      - name: Login to Azure
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZUREAPPSERVICE_CLIENTID_8FD47A61697C42B88B3A8698602713EF }}
          tenant-id: ${{ secrets.AZUREAPPSERVICE_TENANTID_FAA97044B19A4630977F2C86C14AB5A4 }}
          subscription-id: ${{ secrets.AZUREAPPSERVICE_SUBSCRIPTIONID_5C67A75889F64364850175AD19913AA1 }}

      - name: Deploy to Azure Web App
        id: deploy-to-webapp
        uses: azure/webapps-deploy@v3
        with:
          app-name: 'g2h-dev'
          slot-name: 'Production'
          package: .
          