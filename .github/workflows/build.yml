name: Build
on:
  push:
    branches:
    - main
  pull_request:
    types:
    - opened
    - synchronize
    - reopened
    - closed
    branches:
    - main
jobs:
  build:
    name: Build
    runs-on: windows-latest
    steps:
    - name: Check out
      uses: actions/checkout@v5
    - name: Setup .Net
      uses: actions/setup-dotnet@v5
      with:
        dotnet-version: 10.x
    - name: Restore
      run: dotnet restore
    - name: Build
      run: dotnet build --no-restore
    - name: Run Unit Tests
      run: >-
        $projects = Get-ChildItem -Path . -Filter "*Tests.Unit*.csproj" -Recurse

        foreach ($project in $projects) {
          Write-Host "Running tests for: $($project.FullName)"
          dotnet test $project.FullName --no-build --verbosity normal
        }
      shell: pwsh
    - name: Run Acceptance Tests
      run: >-
        $projects = Get-ChildItem -Path . -Filter "*Tests.Acceptance*.csproj" -Recurse

        foreach ($project in $projects) {
          Write-Host "Running tests for: $($project.FullName)"
          dotnet test $project.FullName --no-build --verbosity normal
        }
    - name: Run Integration Tests
      shell: pwsh
      run: |
        # windows-latest ships SQL Server LocalDB; the fixtures connect to
        # (localdb)\MSSQLLocalDB and create one database per process id.
        sqllocaldb start MSSQLLocalDB
        $projects = Get-ChildItem -Path . -Filter "*Tests.Integration*.csproj" -Recurse
        foreach ($project in $projects) {
          Write-Host "Running integration tests for: $($project.FullName)"
          dotnet test $project.FullName --no-build --verbosity normal
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
        }
    - name: Verify migration script applies under sqlcmd defaults
      shell: pwsh
      run: |
        # Regression guard for the QUOTED_IDENTIFIER fix: the generated script must
        # carry its own SET options so it applies under sqlcmd's default
        # QUOTED_IDENTIFIER OFF. We regenerate via the tool and apply WITHOUT -I; a
        # broken header fails the very first CREATE INDEX with Msg 1934.
        dotnet tool install --global dotnet-ef --version 10.0.10 `
          || dotnet tool update --global dotnet-ef --version 10.0.10
        bash Tools/new-database-script.sh Glory2Him.Core.Database.sql
        if ($LASTEXITCODE -ne 0) { throw "migration script generation failed" }
        sqllocaldb start MSSQLLocalDB
        sqlcmd -S "(localdb)\MSSQLLocalDB" -b -Q "IF DB_ID('G2H_MigrationCheck') IS NOT NULL DROP DATABASE [G2H_MigrationCheck]; CREATE DATABASE [G2H_MigrationCheck];"
        if ($LASTEXITCODE -ne 0) { throw "could not create the check database" }
        sqlcmd -S "(localdb)\MSSQLLocalDB" -d "G2H_MigrationCheck" -i "Glory2Him.Core.Database.sql" -b
        if ($LASTEXITCODE -ne 0) { throw "migration script failed under sqlcmd defaults (QUOTED_IDENTIFIER)" }
        sqlcmd -S "(localdb)\MSSQLLocalDB" -b -Q "DROP DATABASE [G2H_MigrationCheck];"
    env: {}
  add_tag:
    name: Tag and Release
    runs-on: ubuntu-latest
    needs:
    - build
    if: >-
      needs.build.result == 'success' && 

      github.event.pull_request.merged && 

      github.event.pull_request.base.ref == 'main' && 

      startsWith(github.event.pull_request.title, 'RELEASES:') && 

      contains(github.event.pull_request.labels.*.name, 'RELEASES')
    steps:
    - name: Checkout code
      uses: actions/checkout@v5
      with:
        token: ${{ secrets.PAT_FOR_TAGGING }}
    - name: Configure Git
      run: >-
        git config user.name "GitHub Action"

        git config user.email "action@github.com"
    - name: Extract Version
      id: extract_version
      run: >
        # Running on Linux/Unix 

        sudo apt-get install xmlstarlet

        version_number=$(xmlstarlet sel -t -v "//Version" -n Glory2Him.Core/Glory2Him.Core.csproj)

        echo "$version_number"

        echo "version_number<<EOF" >> $GITHUB_OUTPUT 

        echo "$version_number" >> $GITHUB_OUTPUT 

        echo "EOF" >> $GITHUB_OUTPUT 
      shell: bash
    - name: Display Version
      run: 'echo "Version number: ${{ steps.extract_version.outputs.version_number }}"'
    - name: Extract Package Release Notes
      id: extract_package_release_notes
      run: >
        # Running on Linux/Unix 

        sudo apt-get install xmlstarlet

        package_release_notes=$(xmlstarlet sel -t -v "//PackageReleaseNotes" -n Glory2Him.Core/Glory2Him.Core.csproj)

        echo "$package_release_notes"

        echo "package_release_notes<<EOF" >> $GITHUB_OUTPUT 

        echo "$package_release_notes" >> $GITHUB_OUTPUT 

        echo "EOF" >> $GITHUB_OUTPUT 
      shell: bash
    - name: Display Package Release Notes
      run: 'echo "Package Release Notes: ${{ steps.extract_package_release_notes.outputs.package_release_notes }}"'
    - name: Create GitHub Tag
      run: >-
        git tag -a "v${{ steps.extract_version.outputs.version_number }}" -m "Release - v${{ steps.extract_version.outputs.version_number }}"

        git push origin --tags
    - name: Create GitHub Release
      uses: actions/create-release@v1
      with:
        tag_name: v${{ steps.extract_version.outputs.version_number }}
        release_name: Release - v${{ steps.extract_version.outputs.version_number }}
        body: >-
          ## Release - v${{ steps.extract_version.outputs.version_number }}


          ### Release Notes

          ${{ steps.extract_package_release_notes.outputs.package_release_notes }}
      env:
        GITHUB_TOKEN: ${{ secrets.PAT_FOR_TAGGING }}
