# Glory2Him — dependency graph manifest
# Part of the solution dependency graph — see README.md in this folder.
# Data only: index.html fetches graph.yml, then each project file, and
# assembles them. Strings with special characters are double-quoted JSON.
#
# Column map (components' col in the project files):
#   0 WebApp exposers   1 WebApp view services   2 WebApp brokers
#   3 WebApp externals  4 Core entry points      5 Core foundations
#   6 Core brokers      7 client/external exposers
#   8 client orchestrations  9 client foundations  10 client brokers
#   11 far externals
# `projects` order controls layout bands; `roots` order controls the
# per-consumer view's tree order. A component flagged shared in its
# project file must appear in roots or its inbound edges are dropped.

solution: Glory2Him
eventBroker: EventBroker
projects:
  - id: webapp
    name: Glory2Him.WebApp
    kind: internal
    file: projects/glory2him-webapp.yml
  - id: core
    name: Glory2Him.Core
    kind: internal
    file: projects/glory2him-core.yml
  - id: security-client
    name: G2H.Security.Client
    kind: library
    file: projects/g2h-security-client.yml
  - id: storage-client
    name: G2H.StorageClient
    kind: library
    file: projects/g2h-storageclient.yml
  - id: ee-client
    name: G2H.EventEnvelope.Client
    kind: library
    file: projects/g2h-eventenvelope-client.yml
  - id: ext-identity
    name: ASP.NET Core Identity
    kind: external
    file: projects/asp-net-core-identity.yml
  - id: ext-securitydb
    name: "EF Core · SecurityDbContext"
    kind: external
    file: projects/ef-core-securitydbcontext.yml
  - id: ext-skiasharp
    name: SkiaSharp
    kind: external
    file: projects/skiasharp.yml
  - id: ext-eventhighway
    name: EventHighway
    kind: external
    file: projects/eventhighway.yml
  - id: ext-efcore
    name: EF Core / SQL Server
    kind: external
    file: projects/ef-core-sql-server.yml
