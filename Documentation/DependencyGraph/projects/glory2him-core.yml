  - id: FS.IdentityUser
    name: IdentityUserService
    layer: foundation
    col: 5
    description: "Read-only foundation over the SECURITY database (design 12.7.1) - who holds a given set of role names. It exists because 7.9 rule 3 and the reviewer-candidates read both ask about ROLE MEMBERSHIP, which lives in the ASP.NET Identity store and nowhere else; ISecurityClient.Users cannot answer it because that client reads a ClaimsPrincipal and so only ever describes the current caller. Unlike every other foundation it takes NO EventEnvelopeBroker and NO SecurityAuditBroker: it writes nothing, publishes nothing and stamps nothing, and WHO may enumerate users is decided by the orchestration above it before the call is made. It applies the rules around the read - fail closed on an empty tier, normalise and deduplicate the names - while the query itself lives in the broker, where EF belongs."
    methods:
      - RetrieveIdentityUsersInRolesAsync
    calls:
      - from: RetrieveIdentityUsersInRolesAsync
        to: IdentityCoreStorageBroker
        method: SelectIdentityUsersInRolesAsync
  - id: IdentityCoreStorageBroker
    name: IdentityCoreStorageBroker
    layer: broker
    col: 6
    description: "Core's READ-ONLY window onto the security database, over the Glory2HimSecurityConnection connection string - a different database from the one StorageBroker serves (design 12.7.1). Read-only is enforced by the interface: it declares Select members only, and no Insert, Update, Delete or Bulk member may be added, because the identity store is another component's source of truth. Core owns no migrations against these tables and the context has no design-time factory, so an accidental --context here fails loudly instead of fighting the host's own migrations. Only the columns the tier lookup needs are mapped."
    methods:
      - SelectIdentityUsersInRolesAsync
    calls:
      - from: SelectIdentityUsersInRolesAsync
        to: EXT.EFCore
        method: ToListAsync
  - id: FS.ApprovalReviewRequest
    name: ApprovalReviewRequestService
    layer: foundation
    col: 5
    description: "Foundation CRUD for ApprovalReviewRequest - the review INVITATIONS of design 7.9. An invitation grants no eligibility and enters no 8.5 condition, so this service has no cross-entity invariant to defend and - uniquely among the approval foundations - takes NO IAccessBroker. It has no Modify either: ApprovalId and RequestedUserId are the halves of the uniqueness index and are fixed at creation, so a mistaken invitation is withdrawn and re-issued rather than edited. Reads are gated on the two parties (requester, invited user) plus the review tier, and answer not-found otherwise. Withdrawal is open to the whole review tier rather than to the requester alone (7.9 rule 5) - the one place it diverges from ApprovalReviewService - so its remove path takes no GetUserIdAsync ownership read. RetireAnsweredApprovalReviewRequestAsync is the workflow's own seam (7.9 rule 6, IApprovalReviewRequestWorkflowService): it mints the system identity through CreateSystemAsync and gates on IsSystemIdentity rather than on a role, because the system context carries no roles and so could never pass the withdraw gate. Like the sibling's dismissal it does NO ProcessedEvents bookkeeping - it has no event address and no handler, so both rows would be written with no reader. The On*Async substrate handlers are wired by EventSubscriptionRegistration to the entity's request events; after the ProcessedEvents dedupe check they delegate to the same Do*Async path as the public methods (dual ProcessedEvents record: inbound + outbound envelope)."
