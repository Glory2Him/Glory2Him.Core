  - id: FS.Association
    name: AssociationService
    layer: foundation
    col: 5
    description: "Foundation CRUD for Association. Reads apply publish-date visibility + ownership checks. Also exposes 5 approval state-transition verbs, each publishing its own fact (Approved/Rejected/Sorted/ConfidenceSet/Scoped); the approval verdicts ask IAccessBroker for the decision. Sort has no request event — it is call-only. The On*Async substrate handlers are wired by EventSubscriptionRegistration to the entity's request events; after the ProcessedEvents dedupe check they delegate to the same Do*Async path as the public methods (dual ProcessedEvents record: inbound + outbound envelope)."
    methods:
      - AddAssociationAsync
      - RetrieveAllAssociationsAsync
      - RetrieveAssociationByIdAsync
      - ModifyAssociationAsync
      - RemoveAssociationByIdAsync
      - HardRemoveAssociationByIdAsync
      - ApproveAssociationAsync
      - BypassApproveAssociationAsync
      - SortAssociationAsync
      - SetAssociationConfidenceAsync
      - SetAssociationScopeAsync
      - OnAddingAssociationAsync
      - OnModifyingAssociationAsync
