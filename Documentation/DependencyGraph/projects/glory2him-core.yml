        method: IsUserInRoleAsync
      - from: UserHasClaimAsync
        to: SC.UserClient
        method: UserHasClaimAsync
      - from: GetCurrentSecurityContextAsync
        to: SC.UserClient
        method: GetUserAsync
  - id: EventEnvelopeBroker
    name: EventEnvelopeBroker
    layer: broker
    col: 6
    description: "Wraps G2H.EventEnvelope.Client — mints sealed envelopes (identity, integrity hash, causation chain) for every operation and event."
    methods:
      - CreateAsync
      - CreateNextAsync
    calls:
      - from: CreateAsync
        to: EEC.Client
        method: CreateAsync
      - from: CreateNextAsync
        to: EEC.Client
        method: CreateNextAsync
  - id: EventBroker
    name: EventBroker
    layer: broker
    col: 6
    description: "Singleton wrapper over EventHighway (SQL Server). One Publish<Entity>Async / SubscribeTo<Entity>EventAsync pair per entity — the operation (Adding…HardRemoved) selects the event address. Request addresses (…ing) are subscribed by services; fact addresses (…ed) currently have no subscribers, so no circular flows exist."
    methods:
      - RegisterEventParticipantAsync
      - RegisterEventAddressesAsync
      - FireScheduledPendingEventsAsync
    calls:
      - from: RegisterEventParticipantAsync
        to: EXT.EventHighway
        method: V2.EventParticipantV2Client.RetrieveOrAddEventParticipantV2Async
      - from: RegisterEventAddressesAsync
        to: EXT.EventHighway
        method: V2.EventAddressV2Client.RetrieveOrRegisterEventAddressV2Async
