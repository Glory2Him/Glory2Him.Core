      - CheckContentItemContentExistsAsync
      - RetrieveAllContentItemsAsync
      - RetrieveContentItemByIdAsync
      - ModifyContentItemAsync
      - RemoveContentItemByIdAsync
      - HardRemoveContentItemByIdAsync
