  - id: AO
    name: ApprovalOrchestrationService
    layer: orchestration
    col: 4
    description: "The approval workflow (design 12.5.3, 16.7, 9.7, 10.17). Records human approve/reject decisions on the Approval row - the source of truth - and re-evaluates a round whenever its inputs change. Holds NONE of the seven entity services on purpose: the decided state reaches its entity as an <Entity>.Approving command event published under the system identity (CreateSystemAsync), addressed to the PROCESSING tier for the versioned types (ContentItem, Link) and to the foundation for the other five. Holds no IApprovalSettingService either - every policy question is asked as a verdict from IAccessBroker. The 22 On*Async handlers verify the envelope signature through IEnvelopeIntegrityBroker and then delegate to the same ProcessEntityAdded / ProcessEntityModified / ProcessApprovalInputsChanged path as the public methods. Has NO IStorageBroker, so no ProcessedEvents dedupe - the integrity verify is its substrate guard instead. The -Removed handlers serve both soft and hard removal; no entity -Removed is subscribed by design (a takedown is not a moderation step). IApprovalCommentService is injected but currently unused. It also carries the 7.9 INVITATION flow (16.7.4): RetrieveReviewerCandidatesAsync, RequestApprovalReviewAsync and WithdrawApprovalReviewRequestAsync, which need BOTH stores - the round, the entity owner and the existing reviews from Core through IAccessBroker, and role membership from the identity store through IIdentityUserService. The 18.6 tier NAMES are composed here from the approval role subjects, so the convention keeps one home. OnApprovalReviewAddedAsync additionally retires the answered invitation through the workflow seam (rule 6), after the signature check and before the suppression test. This took the service to eleven dependencies - see issue 348. ILoggingBroker is exception-path only, so no logging edge is drawn."
