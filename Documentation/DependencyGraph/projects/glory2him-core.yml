  - id: SecurityBroker
    name: SecurityBroker
    layer: broker
    col: 6
    description: "Wraps G2H.Security.Client's UserClient (ISecurityClient.Users); resolves the ClaimsPrincipal from IHttpContextAccessor or a JWT access token. Not yet consumed by any Core service."
    methods:
      - GetCurrentUserAsync
      - IsCurrentUserAuthenticatedAsync
      - IsInRoleAsync
      - UserHasClaimAsync
      - GetCurrentSecurityContextAsync
    calls:
      - from: GetCurrentUserAsync
        to: SC.UserClient
        method: GetUserAsync
      - from: IsCurrentUserAuthenticatedAsync
        to: SC.UserClient
        method: IsUserAuthenticatedAsync
      - from: IsInRoleAsync
