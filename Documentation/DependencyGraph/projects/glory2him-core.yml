  - id: EnvelopeIntegrityBroker
    name: EnvelopeIntegrityBroker
    layer: broker
    col: 6
    description: "Symmetric HMAC over a shared secret: signs every envelope on publish and verifies it on receive, so a tampered payload or an envelope that never went through the proper code path is detectable (design 14.6 rule 4). Takes only IConfiguration, so it makes no outbound calls - a leaf. Sixteen components use it: EventBroker signs on publish and verifies the reply, and every foundation, processing and orchestration service verifies inside its substrate handlers before any work is done."
    methods:
      - SignAsync
      - VerifyAsync
  - id: DateTimeBroker
    name: DateTimeBroker
    layer: broker
    col: 6
    utility: true
    methods:
      - GetCurrentDateTimeOffsetAsync
  - id: IdentifierBroker
    name: IdentifierBroker
    layer: broker
    col: 6
    utility: true
    methods:
      - GetIdentifierAsync
  - id: HashBroker
    name: HashBroker
    layer: broker
    col: 6
    utility: true
    methods:
      - ComputeSha256HashAsync
  - id: LoggingBroker
    name: LoggingBroker
    layer: broker
    col: 6
    utility: true
    description: "Happy-path denial logging on reads is drawn; exception-path logging (TryCatch) is not."
    methods:
      - LogInformationAsync
      - LogWarningAsync
      - LogErrorAsync
      - LogCriticalAsync
  - id: FS.ContentItem
    name: ContentItemService
    layer: foundation
    col: 5
    description: "Foundation CRUD for ContentItem. Reads apply publish-date visibility + ownership checks. The On*Async substrate handlers are wired by EventSubscriptionRegistration to the entity's request events; after the ProcessedEvents dedupe check they delegate to the same Do*Async path as the public methods (dual ProcessedEvents record: inbound + outbound envelope)."
