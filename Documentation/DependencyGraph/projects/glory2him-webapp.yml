# Glory2Him.WebApp — components and flows
# Part of the solution dependency graph — see README.md in this folder.
# Data only: index.html fetches graph.yml, then each project file, and
# assembles them. Strings with special characters are double-quoted JSON.

project: webapp
components:
  - id: WA.PostApi
    name: PostApiEndpoints
    layer: exposer
    col: 0
    description: "Minimal-API endpoint group. Glory2Him.WebApp is currently standalone — it has no project reference to Glory2Him.Core; it serves the React SPA with its own Identity database and sample in-memory data."
    methods:
      - GET /api/posts
      - "GET /api/posts/slug/{slug}"
      - "GET /api/posts/{id}"
      - POST /api/posts
      - "PUT /api/posts/{id}"
      - "DELETE /api/posts/{id}"
    calls:
      - from: GET /api/posts
        to: WA.PostsView
        method: RetrieveAllPostsAsync
      - from: "GET /api/posts/slug/{slug}"
        to: WA.PostsView
        method: RetrievePostBySlugAsync
      - from: "GET /api/posts/{id}"
        to: WA.PostsView
        method: RetrievePostByIdAsync
      - from: POST /api/posts
        to: WA.PostsView
        method: AddPostAsync
      - from: "PUT /api/posts/{id}"
        to: WA.PostsView
        method: ModifyPostAsync
      - from: "DELETE /api/posts/{id}"
        to: WA.PostsView
        method: RemovePostAsync
  - id: WA.PostsView
    name: PostsViewService
    layer: view
    col: 1
    description: Backed by the in-memory SamplePosts store (no database yet).
    methods:
      - RetrieveAllPostsAsync
      - RetrievePostBySlugAsync
      - RetrievePostByIdAsync
      - AddPostAsync
      - ModifyPostAsync
      - RemovePostAsync
    calls:
      - from: RetrieveAllPostsAsync
        to: WA.SamplePosts
        method: All
      - from: RetrievePostBySlugAsync
        to: WA.SamplePosts
        method: All
      - from: RetrievePostByIdAsync
        to: WA.SamplePosts
        method: All
      - from: ModifyPostAsync
        to: WA.SamplePosts
        method: All
      - from: RemovePostAsync
        to: WA.SamplePosts
        method: All
      - from: AddPostAsync
        to: WA.SamplePosts
        method: NextId
      - from: AddPostAsync
        to: WA.SamplePosts
        method: All
  - id: WA.SamplePosts
    name: SamplePosts (in-memory)
    layer: broker
    col: 2
    description: Static sample data store standing in for a future data source.
    methods:
      - All
      - NextId
  - id: WA.ProductApi
    name: ProductApiEndpoints
    layer: exposer
    col: 0
    methods:
      - GET /api/products
      - "GET /api/products/slug/{slug}"
    calls:
      - from: GET /api/products
        to: WA.ProductsView
        method: RetrieveAllProductsAsync
      - from: "GET /api/products/slug/{slug}"
        to: WA.ProductsView
        method: RetrieveProductBySlugAsync
  - id: WA.ProductsView
    name: ProductsViewService
    layer: view
    col: 1
    description: Backed by the in-memory SampleProducts store.
    methods:
      - RetrieveAllProductsAsync
      - RetrieveProductBySlugAsync
    calls:
      - from: RetrieveAllProductsAsync
        to: WA.SampleProducts
        method: All
      - from: RetrieveProductBySlugAsync
        to: WA.SampleProducts
        method: All
  - id: WA.SampleProducts
    name: SampleProducts (in-memory)
    layer: broker
    col: 2
    methods:
      - All
  - id: WA.ProfileApi
    name: ProfileApiEndpoints
    layer: exposer
    col: 0
    methods:
      - GET /api/profile
      - PUT /api/profile
      - POST /api/profile/image
      - DELETE /api/profile/image
      - "GET /Profile-Image/{userId} (Program.cs)"
    calls:
      - from: GET /api/profile
        to: WA.ProfileView
        method: RetrieveProfileByIdAsync
      - from: GET /api/profile
        to: EXT.Identity
        method: UserManager.GetUserAsync
      - from: PUT /api/profile
        to: EXT.Identity
        method: UserManager.GetUserAsync
      - from: PUT /api/profile
        to: EXT.Identity
        method: UserManager.SetPhoneNumberAsync
      - from: PUT /api/profile
        to: EXT.Identity
        method: UserManager.UpdateAsync
      - from: PUT /api/profile
        to: EXT.Identity
        method: SignInManager.RefreshSignInAsync
      - from: POST /api/profile/image
        to: WA.ProfileView
        method: SetProfileImageAsync
      - from: DELETE /api/profile/image
        to: WA.ProfileView
        method: RemoveProfileImageAsync
      - from: "GET /Profile-Image/{userId} (Program.cs)"
        to: WA.ProfileView
        method: RetrieveProfileImageAsync
  - id: WA.ProfileView
    name: ProfileViewService
    layer: view
    col: 1
    methods:
      - RetrieveProfileByIdAsync
      - SetProfileImageAsync
      - RemoveProfileImageAsync
      - RetrieveProfileImageAsync
    calls:
      - from: RetrieveProfileByIdAsync
        to: WA.ProfileImageBroker
        method: SelectUserByIdAsync
      - from: SetProfileImageAsync
        to: WA.ImageProcessingBroker
        method: CreateSquareAvatarAsync
      - from: SetProfileImageAsync
        to: WA.ProfileImageBroker
        method: UpdateProfileImageAsync
      - from: RemoveProfileImageAsync
        to: WA.ProfileImageBroker
        method: UpdateProfileImageAsync
      - from: RetrieveProfileImageAsync
        to: WA.ProfileImageBroker
        method: SelectUserByIdAsync
  - id: WA.ProfileImageBroker
    name: ProfileImageBroker
    layer: broker
    col: 2
    description: "Reads/writes AppUser.ProfileImage via IDbContextFactory<SecurityDbContext>."
    methods:
      - SelectUserByIdAsync
      - UpdateProfileImageAsync
    calls:
      - from: SelectUserByIdAsync
        to: EXT.SecurityDb
        method: "Users (DbSet<AppUser>)"
      - from: UpdateProfileImageAsync
        to: EXT.SecurityDb
        method: "Users (DbSet<AppUser>)"
      - from: UpdateProfileImageAsync
        to: EXT.SecurityDb
        method: SaveChangesAsync
  - id: WA.ImageProcessingBroker
    name: ImageProcessingBroker
    layer: broker
    col: 2
    methods:
      - CreateSquareAvatarAsync
    calls:
      - from: CreateSquareAvatarAsync
        to: EXT.SkiaSharp
        method: SKBitmap.Decode
      - from: CreateSquareAvatarAsync
        to: EXT.SkiaSharp
        method: SKBitmap.Resize
      - from: CreateSquareAvatarAsync
        to: EXT.SkiaSharp
        method: SKImage.FromBitmap
      - from: CreateSquareAvatarAsync
        to: EXT.SkiaSharp
        method: SKImage.Encode (WebP)
  - id: WA.RegistrationApi
    name: RegistrationApiEndpoints
    layer: exposer
    col: 0
    methods:
      - GET /api/registrations/username-available
      - GET /api/registrations/email-in-use
      - GET /api/registrations/username-suggestions
      - POST /api/registrations
    calls:
      - from: GET /api/registrations/username-available
        to: WA.RegistrationView
        method: IsUsernameAvailableAsync
      - from: GET /api/registrations/username-available
        to: WA.RegistrationView
        method: MinimumUsernameLength
      - from: GET /api/registrations/email-in-use
        to: WA.RegistrationView
        method: IsEmailInUseAsync
      - from: GET /api/registrations/username-suggestions
        to: WA.RegistrationView
        method: SuggestUsernamesAsync
      - from: POST /api/registrations
        to: WA.RegistrationView
        method: IsUsernameAvailableAsync
      - from: POST /api/registrations
        to: WA.RegistrationView
        method: IsEmailInUseAsync
      - from: POST /api/registrations
        to: EXT.Identity
        method: UserManager.CreateAsync
      - from: POST /api/registrations
        to: EXT.Identity
        method: UserManager.AddToRoleAsync
      - from: POST /api/registrations
        to: EXT.Identity
        method: IUserStore.SetUserNameAsync
      - from: POST /api/registrations
        to: EXT.Identity
        method: IUserEmailStore.SetEmailAsync
  - id: WA.RegistrationView
    name: RegistrationViewService
    layer: view
    col: 1
    methods:
      - MinimumUsernameLength
      - IsUsernameAvailableAsync
      - IsEmailInUseAsync
      - SuggestUsernamesAsync
    calls:
      - from: IsUsernameAvailableAsync
        to: WA.AccountBroker
        method: UsernameExistsAsync
      - from: IsEmailInUseAsync
        to: WA.AccountBroker
        method: EmailExistsAsync
      - from: SuggestUsernamesAsync
        to: WA.AccountBroker
        method: UsernameExistsAsync
  - id: WA.AccountBroker
    name: AccountBroker
    layer: broker
    col: 2
    description: "Queries normalized username/email columns via IDbContextFactory<SecurityDbContext>."
    methods:
      - UsernameExistsAsync
      - EmailExistsAsync
    calls:
      - from: UsernameExistsAsync
        to: EXT.SecurityDb
        method: "Users (DbSet<AppUser>)"
      - from: EmailExistsAsync
        to: EXT.SecurityDb
        method: "Users (DbSet<AppUser>)"
