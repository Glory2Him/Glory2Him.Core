name: Labels
on:
  workflow_dispatch:
  push:
    branches:
    - main
    paths:
    - .github/labels.json
    - .github/workflows/labels.yml
jobs:
  sync:
    name: Sync
    runs-on: ubuntu-latest
    steps:
    - name: Check out
      uses: actions/checkout@v5
    - name: Sync Labels
      uses: actions/github-script@v8
      with:
        github-token: ${{ secrets.GITHUB_TOKEN }}
        script: |
          const fs = require('fs');

          // A repository created from the template does not always run workflows on its
          // very first commit. If the labels are missing, run this workflow by hand once:
          // Actions -> Labels -> Run workflow.
          const manifest = JSON.parse(fs.readFileSync('.github/labels.json', 'utf8'));

          const existing = await github.paginate(github.rest.issues.listLabelsForRepo, {
            owner: context.repo.owner,
            repo: context.repo.repo,
            per_page: 100
          });

          const byName = new Map(existing.map(label => [label.name, label]));
          let created = 0;
          let updated = 0;

          for (const label of manifest) {
            const current = byName.get(label.name);

            if (!current) {
              await github.rest.issues.createLabel({
                owner: context.repo.owner,
                repo: context.repo.repo,
                name: label.name,
                color: label.color,
                description: label.description
              });

              console.log(`Created: ${label.name}`);
              created++;
              continue;
            }

            const colorMatches = current.color.toLowerCase() === label.color.toLowerCase();
            const descriptionMatches = (current.description || '') === label.description;

            if (colorMatches && descriptionMatches) {
              continue;
            }

            await github.rest.issues.updateLabel({
              owner: context.repo.owner,
              repo: context.repo.repo,
              name: label.name,
              color: label.color,
              description: label.description
            });

            console.log(`Updated: ${label.name}`);
            updated++;
          }

          // Labels are never deleted. A label this repository added by hand, and any label
          // GitHub created with the repository, is left exactly as it is.
          const summary = `${created} created, ${updated} updated, ${manifest.length} in manifest.`;
          console.log(summary);
          await core.summary.addRaw(summary).write();
    permissions:
      contents: read
      issues: write
