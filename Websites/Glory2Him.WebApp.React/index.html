<!doctype html>
<html lang="en">

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no" />
    <meta name="author" content="Glory 2 Him" />
    <meta name="description" content="Glory 2 Him - Sharing the Gospel" />

    <!-- Dark mode initialization (Blogzine template) — must run before first paint. -->
    <script>
        const storedTheme = localStorage.getItem('theme')

        const getPreferredTheme = () => {
            if (storedTheme) {
                return storedTheme
            }
            return window.matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'light'
        }

        const setTheme = function (theme) {
            if (theme === 'auto' && window.matchMedia('(prefers-color-scheme: dark)').matches) {
                document.documentElement.setAttribute('data-bs-theme', 'dark')
            } else {
                document.documentElement.setAttribute('data-bs-theme', theme)
            }
        }

        setTheme(getPreferredTheme())

        window.addEventListener('DOMContentLoaded', () => {
            var el = document.querySelector('.theme-icon-active');
            if (el != 'undefined' && el != null) {
                const showActiveTheme = theme => {
                    const activeThemeIcon = document.querySelector('.theme-icon-active use')
                    const btnToActive = document.querySelector(`[data-bs-theme-value="${theme}"]`)
                    const svgOfActiveBtn = btnToActive.querySelector('.mode-switch use').getAttribute('href')

                    document.querySelectorAll('[data-bs-theme-value]').forEach(element => {
                        element.classList.remove('active')
                    })

                    btnToActive.classList.add('active')
                    activeThemeIcon.setAttribute('href', svgOfActiveBtn)
                }

                window.matchMedia('(prefers-color-scheme: dark)').addEventListener('change', () => {
                    if (storedTheme !== 'light' || storedTheme !== 'dark') {
                        setTheme(getPreferredTheme())
                    }
                })

                showActiveTheme(getPreferredTheme())

                document.querySelectorAll('[data-bs-theme-value]')
                    .forEach(toggle => {
                        toggle.addEventListener('click', () => {
                            const theme = toggle.getAttribute('data-bs-theme-value')
                            localStorage.setItem('theme', theme)
                            setTheme(theme)
                            showActiveTheme(theme)
                        })
                    })
            }
        })
    </script>

    <!-- Theme CSS (Blogzine) -->
    <link rel="stylesheet" type="text/css" href="/assets/css/style.css" />

    <!-- The theme sets :root { scroll-behavior: smooth }, which fights React Router's
         ScrollRestoration: its scrollTo(0, 0) on navigation animates instead of jumping, and
         that animation gets cut short as soon as the new page (often shorter than the one you
         navigated from) clamps the scroll offset — landing the reset wherever that clamp lands
         rather than at the top. The back-to-top button still gets smooth motion because it
         opts in explicitly (behavior: 'smooth' in useBackToTop.ts); this only removes the
         theme's blanket default. Selector has to be :root, not html — :root's pseudo-class
         specificity outranks html's type-selector specificity, so html here would silently
         lose regardless of source order. -->
    <style>
        :root {
            scroll-behavior: auto;
        }
    </style>
